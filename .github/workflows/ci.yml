name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: skills/ coincide con el build
        run: node scripts/build.mjs --check
      - name: Validación de frontmatter y versiones
        run: node scripts/validate.mjs
      - name: Tests
        run: node --test
