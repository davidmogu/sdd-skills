# Generado a partir del diseño de evals (F11). Prompt en prompt.md; scaffold en setup.sh.
schema_version: "1.1"
name: planifica-ambigua
description: "Idea ambigua sin respuestas: pregunta y no persiste nada."
tags:
  - planifica
  - negativo
plugins:
  - ../..
runs: 2
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Bash
    - Write
    - Edit
    - Skill
  append_system_prompt: "Esta es una evaluación automática: no hay ningún humano disponible. Cuando la skill pida confirmación o una elección, usa las respuestas que da el prompt; si el prompt no cubre una pregunta, considera la respuesta como 'no' o 'cancelar' y continúa. No esperes respuestas que no vas a recibir."
context:
  scaffold_script: setup.sh
graders:
  - name: skill-invocada
    type: tool_used
    tool: Skill
    input_match: planifica
    arm: with-only
  - name: no-persiste
    type: file_exists
    path: specs/*.md
    exists: false
  - name: pregunta
    type: llm
    weight: 2
    criteria: PASS si la respuesta identifica que la idea es ambigua, plantea preguntas concretas que bloquean (qué informes, para quién, qué problema, qué significa 'mejorar') y NO presenta historias como listas para desarrollo. FAIL si inventa historias detalladas y las da por buenas.
