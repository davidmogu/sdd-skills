# Generado a partir del diseño de evals (F11). Prompt en prompt.md; scaffold en setup.sh.
schema_version: "1.1"
name: revisa-sin-acceso
description: "Sin acceso al hosting: se detiene con instrucciones, sin inventar hallazgos."
tags:
  - revisa
  - negativo
plugins:
  - ../..
runs: 2
execution:
  max_turns: 40
  timeout_seconds: 600
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Bash
    - Write
    - Edit
    - Skill
  append_system_prompt: "Esta es una evaluación automática: no hay ningún humano disponible. Cuando la skill pida confirmación o una elección, usa las respuestas que da el prompt; si el prompt no cubre una pregunta, considera la respuesta como 'no' o 'cancelar' y continúa. No esperes respuestas que no vas a recibir."
context:
  scaffold_script: setup.sh
graders:
  - name: skill-invocada
    type: tool_used
    tool: Skill
    input_match: revisa
    arm: with-only
  - name: no-inventa
    type: llm
    weight: 3
    criteria: PASS si la respuesta indica que no puede acceder al hosting o al PR (sin autenticación, repo inexistente o CLI ausente), explica cómo resolverlo (p. ej. gh auth login) sin pedir tokens en el chat, y NO inventa hallazgos de revisión. FAIL si presenta una revisión con hallazgos de un PR que no ha podido leer.
